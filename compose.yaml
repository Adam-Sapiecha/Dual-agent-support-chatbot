name: dual-agent-support
services:
  web:
    image: dual-agent-support:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:${DEMO_PORT:-8091}:8080"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=32m -XX:+ExitOnOutOfMemoryError"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q '200' <&3"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
